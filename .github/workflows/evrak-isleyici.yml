name: Evrak İşleyici (Windows programı)

on:
  push:
    paths:
      - 'evrak/isleyici/**'
      - 'evrak/apps-script/Form.html'
      - '.github/workflows/evrak-isleyici.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: evrak/isleyici
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: Tesseract (Türkçe yazı okuma) — programa gömülecek
        shell: bash
        run: |
          choco install tesseract -y --no-progress
          T="/c/Program Files/Tesseract-OCR"
          curl -sSL -o "$T/tessdata/tur.traineddata" https://github.com/tesseract-ocr/tessdata/raw/4.1.0/tur.traineddata
          mkdir -p gomulu/tesseract/tessdata
          cp "$T"/*.exe "$T"/*.dll gomulu/tesseract/ 2>/dev/null || true
          cp "$T/tessdata/tur.traineddata" "$T/tessdata/osd.traineddata" gomulu/tesseract/tessdata/ 2>/dev/null || true
          cp "$T/tessdata/eng.traineddata" gomulu/tesseract/tessdata/ 2>/dev/null || true
          rm -f gomulu/tesseract/*training*.exe gomulu/tesseract/unicharset_extractor.exe gomulu/tesseract/*_tool*.exe
          du -sh gomulu/tesseract; ls gomulu/tesseract/tessdata
      - name: Görüntü ve akış denemesi
        shell: bash
        run: |
          python -c "import sys; sys.path.insert(0,'.'); import goruntu, islem, ayar, yerel_form, agy_evrak; print('modüller tamam', ayar.SURUM)"
          python test/ornek_uret.py "$RUNNER_TEMP/ornek"
          python test/akis_dene.py "$RUNNER_TEMP/ornek"
          python test/ocr_dene.py "$RUNNER_TEMP/ornek"
          python test/bol_dene.py
      - name: Derle
        run: |
          python simge_yap.py
          pyinstaller --noconfirm --onefile --windowed --name AGY-Evrak --icon simge.ico --hidden-import pystray._win32 --add-data "../apps-script/Form.html;." --add-data "gomulu/tesseract;tesseract" --hidden-import pypdfium2 --collect-data pypdfium2 --collect-binaries pypdfium2 --exclude-module tkinter agy_evrak.py
      - name: Sürüm kontrolü
        shell: bash
        run: ls -la dist && test -s dist/AGY-Evrak.exe
      - uses: actions/upload-artifact@v4
        with:
          name: AGY-Evrak
          path: evrak/isleyici/dist/AGY-Evrak.exe
      - name: Yayın (en son sürüm)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SURUM=$(python -c "import ayar; print(ayar.SURUM)")
          gh release delete evrak-isleyici --yes --cleanup-tag || true
          gh release create evrak-isleyici dist/AGY-Evrak.exe --target "${{ github.sha }}" --prerelease \
            --title "AGY Evrak İşleyici $SURUM" --notes "Windows programı. Kurulum: evrak/KURULUM.md"
