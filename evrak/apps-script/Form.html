<!doctype html>
<html lang="tr">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root {
    --lacivert: #15284b; --lacivert-2: #1f3a6d; --zemin: #eef1f6; --kart: #ffffff; --yazi: #172033; --soluk: #64708a;
    --cizgi: #dfe4ee; --giris: #f6f8fb; --odak: #2f5fb3; --iyi: #17914f; --iyi-acik: #e5f5ec; --uyari: #e07a1f; --uyari-acik: #fdf0e3;
    --kotu: #c0392b; --kotu-acik: #fbe9e7; --golge: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --zemin: #0c1220; --kart: #141c2e; --yazi: #e8edf6; --soluk: #95a1b8; --cizgi: #26314a; --giris: #0f1626; --odak: #6d9cf0;
      --iyi: #3cc47d; --iyi-acik: rgba(60,196,125,.14); --uyari: #f2a14a; --uyari-acik: rgba(242,161,74,.14); --kotu: #ff7a6b; --kotu-acik: rgba(255,122,107,.14);
      --golge: 0 1px 2px rgba(0,0,0,.4); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--zemin); color: var(--yazi); }
  body { font: 16px/1.45 Inter, -apple-system, "Segoe UI", Roboto, sans-serif; font-feature-settings: "calt" 0; }

  /* üst bant */
  .ust { background: linear-gradient(160deg, var(--lacivert) 0%, var(--lacivert-2) 100%); color: #fff; padding: 18px 20px 64px; }
  .ust-ic { max-width: 560px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ust img { height: 46px; width: auto; display: block; }
  .ust .etiket { font-size: .72rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; padding: 6px 10px; border: 1px solid rgba(255,255,255,.28); border-radius: 99px; color: rgba(255,255,255,.9); }

  main { max-width: 560px; margin: -48px auto 0; padding: 0 16px 120px; }

  /* paket özeti */
  .ozet { background: var(--kart); border-radius: 18px; box-shadow: var(--golge); padding: 16px 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 14px; border: 1px solid var(--cizgi); }
  .ozet .ikon { width: 48px; height: 48px; border-radius: 14px; background: var(--iyi-acik); color: var(--iyi); display: grid; place-items: center; flex: none; }
  .ozet b { display: block; font-size: 1.15rem; font-weight: 800; letter-spacing: -.01em; }
  .ozet small { color: var(--soluk); font: 500 .78rem "JetBrains Mono", ui-monospace, monospace; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .ozet > div:last-child { min-width: 0; }

  /* bölümler */
  .bolum { background: var(--kart); border-radius: 18px; box-shadow: var(--golge); border: 1px solid var(--cizgi); padding: 16px 18px 18px; margin-bottom: 14px; }
  .bolum-bas { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bolum-bas .no { width: 24px; height: 24px; border-radius: 8px; background: var(--lacivert-2); color: #fff; font-size: .78rem; font-weight: 800; display: grid; place-items: center; }
  .bolum-bas h2 { font-size: .8rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; margin: 0; color: var(--soluk); }

  .alan { position: relative; margin-top: 12px; }
  .alan:first-of-type { margin-top: 0; }
  .alan label { display: block; font-size: .82rem; font-weight: 600; color: var(--soluk); margin: 0 0 6px 2px; }
  .alan input, textarea { width: 100%; font: inherit; font-size: 17px; font-weight: 500; padding: 13px 14px; border-radius: 12px; border: 1.5px solid var(--cizgi); background: var(--giris); color: var(--yazi); outline: none; transition: border-color .15s, box-shadow .15s; }
  .alan input:focus, textarea:focus { border-color: var(--odak); box-shadow: 0 0 0 4px color-mix(in srgb, var(--odak) 18%, transparent); background: var(--kart); }
  textarea { min-height: 72px; resize: vertical; font-weight: 400; }

  .oneri { position: absolute; left: 0; right: 0; top: 100%; z-index: 20; margin-top: 6px; background: var(--kart); border: 1px solid var(--cizgi); border-radius: 14px; box-shadow: 0 12px 32px rgba(16,24,40,.18); overflow: hidden; }
  .oneri button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; font: inherit; font-size: 16px; padding: 12px 14px; border: 0; border-top: 1px solid var(--cizgi); background: none; color: var(--yazi); }
  .oneri button:first-child { border-top: 0; }
  .oneri button::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--odak); opacity: .5; flex: none; }
  .oneri mark { background: none; color: var(--odak); font-weight: 700; }

  /* son işler */
  .cipler { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; margin: 0 -4px; padding-left: 4px; scrollbar-width: none; }
  .cipler::-webkit-scrollbar { display: none; }
  .cip { flex: none; font: inherit; font-size: .88rem; padding: 9px 13px; border-radius: 12px; border: 1.5px solid var(--cizgi); background: var(--giris); color: var(--yazi); text-align: left; line-height: 1.25; max-width: 220px; }
  .cip b { display: block; font-weight: 700; }
  .cip span { color: var(--soluk); font-size: .8rem; }
  .cip:active { border-color: var(--odak); }

  /* ACİL anahtarı */
  .satir { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .satir b { display: block; font-weight: 700; } .satir small { color: var(--soluk); font-size: .82rem; }
  .anahtar { position: relative; width: 54px; height: 32px; flex: none; }
  .anahtar input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; z-index: 1; }
  .anahtar span { position: absolute; inset: 0; border-radius: 99px; background: var(--cizgi); transition: background .2s; }
  .anahtar span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .anahtar input:checked + span { background: var(--kotu); }
  .anahtar input:checked + span::after { transform: translateX(22px); }
  .ayrac { height: 1px; background: var(--cizgi); margin: 16px 0; }

  /* evrak durumu */
  .secim { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .secim button { font: inherit; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 8px 12px; border-radius: 14px; border: 2px solid var(--cizgi); background: var(--giris); color: var(--soluk); transition: all .15s; }
  .secim button b { font-size: .92rem; font-weight: 800; letter-spacing: .04em; }
  .secim button small { font-size: .74rem; font-weight: 600; opacity: .85; }
  .secim svg { width: 22px; height: 22px; }
  .secim button.eksik.secili { border-color: var(--uyari); background: var(--uyari-acik); color: var(--uyari); }
  .secim button.tamam.secili { border-color: var(--iyi); background: var(--iyi); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--iyi) 35%, transparent); }

  /* alt düğme */
  .alt-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--zemin) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--cizgi); z-index: 30; }
  .alt-bar button { display: block; width: 100%; max-width: 528px; margin: 0 auto; font: inherit; font-size: 17px; font-weight: 800; letter-spacing: .02em; padding: 16px; border: 0; border-radius: 14px; background: linear-gradient(160deg, var(--lacivert-2), var(--lacivert)); color: #fff; box-shadow: 0 8px 20px rgba(21,40,75,.3); }
  .alt-bar button:disabled { opacity: .65; }

  .mesaj { padding: 12px 14px; border-radius: 14px; margin-bottom: 14px; font-weight: 600; font-size: .92rem; }
  .mesaj.bilgi { background: color-mix(in srgb, var(--odak) 12%, transparent); color: var(--odak); }
  .mesaj.kotu { background: var(--kotu-acik); color: var(--kotu); }

  /* başarı ekranı */
  .basari { text-align: center; padding: 28px 20px 24px; }
  .tik { width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 50%; background: var(--iyi); display: grid; place-items: center; box-shadow: 0 10px 28px color-mix(in srgb, var(--iyi) 40%, transparent); animation: belir .35s ease-out; }
  .tik svg { width: 40px; height: 40px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: ciz .4s .2s ease-out forwards; }
  @keyframes belir { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes ciz { to { stroke-dashoffset: 0; } }
  .basari h1 { font-size: 1.4rem; font-weight: 800; margin: 0 0 4px; }
  .basari p { color: var(--soluk); margin: 0 0 16px; }
  .ozet-liste { text-align: left; border: 1px solid var(--cizgi); border-radius: 14px; overflow: hidden; }
  .ozet-liste div { display: flex; justify-content: space-between; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--cizgi); font-size: .92rem; }
  .ozet-liste div:first-child { border-top: 0; }
  .ozet-liste span { color: var(--soluk); } .ozet-liste b { text-align: right; }
  .rozet { display: inline-block; font-size: .74rem; font-weight: 800; letter-spacing: .06em; padding: 3px 8px; border-radius: 6px; }
  .rozet.tamam { background: var(--iyi-acik); color: var(--iyi); } .rozet.eksik { background: var(--uyari-acik); color: var(--uyari); } .rozet.acil { background: var(--kotu-acik); color: var(--kotu); }
  .duzelt { margin-top: 16px; font: inherit; font-weight: 700; color: var(--odak); background: none; border: 0; padding: 10px; }
</style>
</head>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>
          <b>EVRAK TAMAM</b><small>çizime hazır</small></button>
      </div>
    </section>

    <section class="bolum">
      <div class="bolum-bas"><span class="no">3</span><h2>Not · isteğe bağlı</h2></div>
      <textarea id="not" placeholder="Örn. tapunun arka yüzü gelecek"></textarea>
    </section>

    <div class="alt-bar"><button id="gonder" type="submit">Kaydet</button></div>
  </form>

  <section class="bolum basari" id="basari" hidden>
    <div class="tik"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
    <h1>Kaydedildi</h1>
    <p id="basariAlt"></p>
    <div class="ozet-liste" id="basariListe"></div>
    <button type="button" class="duzelt" id="duzelt">Bilgileri düzelt</button>
  </section>
</main>

<script>
  const DURUM = <?!= durum ?>, ISLER = <?!= isler ?>, ELEKTRIKCILER = <?!= elektrikciler ?>, TURLER = <?!= turler ?>;
  const $ = id => document.getElementById(id);
  const kacis = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const mesaj = (t, tur) => { $('mesaj').innerHTML = t ? '<div class="mesaj ' + tur + '">' + t + '</div>' : ''; };
  const B = s => String(s || '').toLocaleUpperCase('tr-TR').replace(/\s+/g, ' ').trim();   // karşılaştırma için
  const tekil = a => { const g = new Set(); return a.filter(v => v && !g.has(B(v)) && g.add(B(v))); };
  const paketSaati = p => { const m = /^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/.exec(p || ''); return m ? m[3] + '.' + m[2] + '.' + m[1] + ' · ' + m[4] + ':' + m[5] : p; };

  // yazarken öneri: kelime başı eşleşenler önce, sonra içinde geçenler; en çok 6
  function oneriKur(id, kaynak, sec) {
    const inp = $(id), kutu = inp.nextElementSibling;
    let gizleT = null;
    const basta = (v, q) => B(v).startsWith(q) || B(v).split(' ').some(w => w.startsWith(q));
    const goster = () => {
      clearTimeout(gizleT);
      const q = B(inp.value), adaylar = tekil(kaynak());
      let l = q ? adaylar.filter(v => basta(v, q)).concat(adaylar.filter(v => !basta(v, q) && B(v).includes(q))) : adaylar;
      l = l.filter(v => B(v) !== q).slice(0, 6);
      if (!l.length) { kutu.hidden = true; return; }
      kutu.innerHTML = l.map(v => {
        const i = q ? B(v).indexOf(q) : -1;
        const vurgu = i >= 0 ? kacis(v.slice(0, i)) + '<mark>' + kacis(v.slice(i, i + q.length)) + '</mark>' + kacis(v.slice(i + q.length)) : kacis(v);
        return '<button type="button" data-v="' + kacis(v) + '"><span>' + vurgu + '</span></button>';
      }).join('');
      kutu.hidden = false;
    };
    inp.addEventListener('input', goster);
    inp.addEventListener('focus', goster);
    inp.addEventListener('blur', () => { gizleT = setTimeout(() => { kutu.hidden = true; }, 150); });
    kutu.addEventListener('mousedown', e => e.preventDefault());
    kutu.addEventListener('click', e => {
      const b = e.target.closest('[data-v]'); if (!b) return;
      inp.value = b.dataset.v; kutu.hidden = true; if (sec) sec(b.dataset.v);
    });
  }

  function durumSec(v) {
    document.querySelectorAll('#evrakDurum button').forEach(b => { const on = b.dataset.v === v; b.classList.toggle('secili', on); b.setAttribute('aria-pressed', on); });
  }
  $('evrakDurum').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) durumSec(b.dataset.v); });
  const tamamMi = () => document.querySelector('#evrakDurum .secili').dataset.v === 'tamam';

  if (DURUM.yok) {
    $('ozetBaslik').textContent = 'Paket bulunamadı';
    $('ozetAlt').textContent = DURUM.paket;
    mesaj('Dosyalar gönderilememiş olabilir. WhatsApp\'tan kestirmeyi yeniden çalıştırın.', 'kotu');
    $('f').hidden = true;
  } else {
    $('ozetBaslik').textContent = DURUM.dosyaSayisi + ' evrak alındı';
    $('ozetAlt').textContent = DURUM.dosyalar ? DURUM.dosyalar.slice(0, 3).join(' · ') + (DURUM.dosyalar.length > 3 ? ' …' : '') : paketSaati(DURUM.paket);
    oneriKur('elektrikci', () => ELEKTRIKCILER.concat(ISLER.map(x => x.elektrikci)), () => $('proje').focus());
    // proje önerisi: yazılan elektrikçinin işleri
    oneriKur('proje', () => { const e = B($('elektrikci').value); return ISLER.filter(x => !e || B(x.elektrikci) === e).map(x => x.proje); },
      v => { const e = B($('elektrikci').value); const is = ISLER.find(x => B(x.proje) === B(v) && (!e || B(x.elektrikci) === e)); if (is && !$('tur').value) $('tur').value = is.tur; });
    oneriKur('tur', () => TURLER.concat(ISLER.map(x => x.tur)));
    if (ISLER.length) {
      $('sonKart').hidden = false;
      $('cipler').innerHTML = ISLER.slice(0, 8).map((x, i) => '<button type="button" class="cip" data-i="' + i + '"><b>' + kacis(x.elektrikci) + '</b><span>' + kacis(x.proje) + '</span></button>').join('');
      $('cipler').addEventListener('click', e => {
        const b = e.target.closest('[data-i]'); if (!b) return;
        const x = ISLER[+b.dataset.i]; $('elektrikci').value = x.elektrikci; $('proje').value = x.proje; $('tur').value = x.tur;
      });
    }
    const b = DURUM.bilgi;
    if (b) {                                         // daha önce kaydedilmiş: düzeltme
      $('elektrikci').value = b.elektrikci; $('proje').value = b.proje; $('tur').value = b.tur;
      $('acil').checked = !!b.acil; durumSec(b.evrakTamam ? 'tamam' : 'eksik'); $('not').value = b.not || '';
      mesaj('Bu paketin bilgisi daha önce kaydedildi. Değiştirip yeniden kaydedebilirsiniz.', 'bilgi');
    }
  }

  function basariGoster(veri, sayi) {
    $('f').hidden = true; $('ozet').hidden = true; mesaj('');
    $('basariAlt').textContent = sayi + ' evrak işe bağlandı';
    $('basariListe').innerHTML =
      '<div><span>Elektrikçi</span><b>' + kacis(veri.elektrikci) + '</b></div>' +
      '<div><span>Proje</span><b>' + kacis(veri.proje) + '</b></div>' +
      '<div><span>Tür</span><b>' + kacis(veri.tur) + '</b></div>' +
      '<div><span>Durum</span><b>' + (veri.acil ? '<span class="rozet acil">ACİL</span> ' : '') + (veri.tamam ? '<span class="rozet tamam">EVRAK TAMAM</span>' : '<span class="rozet eksik">EVRAK EKSİK</span>') + '</b></div>';
    $('basari').hidden = false; window.scrollTo(0, 0);
  }
  $('duzelt').addEventListener('click', () => { $('basari').hidden = true; $('f').hidden = false; $('ozet').hidden = false; $('gonder').textContent = 'Yeniden kaydet'; });

  $('f').addEventListener('submit', e => {
    e.preventDefault();
    $('gonder').disabled = true; $('gonder').textContent = 'Kaydediliyor…';
    const veri = { elektrikci: $('elektrikci').value, proje: $('proje').value, tur: $('tur').value, acil: $('acil').checked, tamam: tamamMi(), not: $('not').value };
    google.script.run
      .withSuccessHandler(r => { $('gonder').disabled = false; basariGoster(veri, r.dosyaSayisi); })
      .withFailureHandler(err => {
        mesaj('Kaydedilemedi: ' + kacis(err.message || err), 'kotu');
        $('gonder').disabled = false; $('gonder').textContent = 'Kaydet'; window.scrollTo(0, 0);
      })
      .bilgiKaydet(DURUM.paket, veri);
  });
</script>
</body>
</html>
