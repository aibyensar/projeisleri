<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kablo Kesiti Hesabı</title>
<link rel="stylesheet" href="../ortak/stil.css">
<style>
  .giris { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .giris label { min-width: 0; }
  .giris input { font-size: 1.4rem; padding: 12px; width: 100%; min-width: 0; }
  .secim { display: flex; gap: 8px; margin-bottom: 12px; }
  .secim button {
    flex: 1; min-width: 0; font: inherit; font-size: .9rem; padding: 10px 6px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--cizgi); background: var(--zemin); color: var(--yazi); line-height: 1.25;
  }
  .secim button small { display: block; font-size: .75rem; opacity: .8; }
  .secim button[aria-pressed="true"] { background: var(--baslik); color: #fff; border-color: var(--baslik); }
  button:focus-visible { outline: 2px solid var(--vurgu); outline-offset: 2px; }
  .buyuk { font-size: 2rem; font-weight: 700; color: var(--vurgu); margin: 4px 0; }
  .adim { padding: 10px 0; border-top: 1px solid var(--cizgi); }
  .adim:first-child { border-top: 0; padding-top: 0; }
  .adim b { display: block; font-size: .85rem; color: var(--soluk); font-weight: 600; }
  .formul { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; overflow-wrap: anywhere; }
  .deger { font-weight: 700; }
  details > summary { cursor: pointer; font-weight: 600; }
  details[open] > summary { margin-bottom: 12px; }
  .kart h2 { margin: 0 0 4px; }
  .ayar-grup { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .ayar-grup h3 { grid-column: 1 / -1; margin: 0; font-size: .9rem; }
  .ayar-grup input { width: 100%; min-width: 0; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .ikincil {
    font: inherit; font-size: .9rem; padding: 8px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--cizgi); background: var(--zemin); color: var(--yazi);
  }
  .degisti { border-color: var(--vurgu) !important; }
  #firmaTablo { border: 1px solid var(--cizgi); }
  #firmaTablo th { white-space: normal; text-align: center; font-size: .75rem; font-weight: 600; vertical-align: bottom;
    border: 1px solid var(--cizgi); background: var(--zemin); min-width: 64px; }
  #firmaTablo td { text-align: center; border-left: 1px solid var(--cizgi); }
  #firmaTablo td:first-child { text-align: left; }
  #firmaNot a { color: var(--ana); }
</style>
</head>
<body>
<header>
  <a href="../index.html">← Proje İşleri</a>
  <h1>Kablo kesiti</h1>
</header>
<main>
  <div class="kart">
    <div class="secim" id="faz">
      <button type="button" data-v="3" aria-pressed="true">Trifaze<small id="lb-u3"></small></button>
      <button type="button" data-v="1" aria-pressed="false">Monofaze<small id="lb-u1"></small></button>
    </div>
    <div class="secim" id="iletken">
      <button type="button" data-v="cu" aria-pressed="true">Bakır</button>
      <button type="button" data-v="al" aria-pressed="false">Alüminyum</button>
    </div>
    <div class="secim" id="kullanim">
      <button type="button" data-v="normal" aria-pressed="true">Normal tesisat<small id="lb-normal"></small></button>
      <button type="button" data-v="motor" aria-pressed="false">Motor<small id="lb-motor"></small></button>
      <button type="button" data-v="trafo" aria-pressed="false">Trafo<small id="lb-trafo"></small></button>
    </div>
    <div class="giris">
      <label>Güç (W)
        <input id="guc" type="number" inputmode="decimal" value="30000" min="0" step="any">
      </label>
      <label>Mesafe (m)
        <input id="uzunluk" type="number" inputmode="decimal" value="100" min="0" step="any">
      </label>
    </div>
  </div>

  <div class="kart" id="sonuc"></div>

  <div class="kart">
    <h2 id="firmaBaslik"></h2>
    <p class="not" id="firmaBilgi"></p>
    <div class="tablo-kutu">
      <table id="firmaTablo"></table>
    </div>
    <p class="not" id="firmaNot"></p>
  </div>

  <div class="kart">
    <details>
      <summary>Formül ve ayarlar</summary>
      <p class="not">Burada yaptığınız değişiklikler bu cihazda saklanır. Değişen kutular turuncu görünür.</p>
      <div class="ayar-grup">
        <h3>Gerilim (V)</h3>
        <label>Trifaze<input id="u-3" type="number" step="any" min="1"></label>
        <label>Monofaze<input id="u-1" type="number" step="any" min="1"></label>
      </div>
      <div class="ayar-grup">
        <h3>İletkenlik k (m/Ω·mm²)</h3>
        <label>Bakır<input id="k-cu" type="number" step="any" min="1"></label>
        <label>Alüminyum<input id="k-al" type="number" step="any" min="1"></label>
      </div>
      <div class="ayar-grup">
        <h3>cos φ</h3>
        <label>Güç katsayısı<input id="cosfi" type="number" step="0.01" min="0.1" max="1"></label>
      </div>
      <div class="ayar-grup">
        <h3>Bu değerlerle çıkan katsayılar</h3>
        <div class="formul" id="katsayiListe" style="grid-column: 1 / -1"></div>
      </div>
      <div class="ayar-grup">
        <h3>İzin verilen gerilim düşümü (%)</h3>
        <label>Normal tesisat<input id="e-normal" type="number" step="0.1" min="0.1"></label>
        <label>Motor<input id="e-motor" type="number" step="0.1" min="0.1"></label>
        <label>Trafo<input id="e-trafo" type="number" step="0.1" min="0.1"></label>
      </div>
      <div class="ayar-grup">
        <h3>Kablo</h3>
        <label>Kablo tipi<select id="tip"></select></label>
        <label>Döşeme<select id="doseme"></select></label>
      </div>
      <button type="button" class="ikincil" id="sifirla">Varsayılan değerlere dön</button>
    </details>
  </div>
</main>
<script src="../veri/kablolar.js"></script>
<script src="../veri/katalog.js"></script>
<script>
// Katsayı: trifaze 100 / (k × U²), monofaze 200 / (k × U²), elle hesaptaki gibi 3 haneye yuvarlanır.
const VARSAYILAN = {
  'u-3': 380, 'u-1': 220, 'k-cu': 56, 'k-al': 35, 'cosfi': 0.85,
  'e-normal': 1.5, 'e-motor': 3, 'e-trafo': 5
};
const ANAHTAR = 'kablo-kesiti-ayarlar-2';
const BIRIM = { '3': 100, '1': 200 };
const katsayiHesapla = (faz, il) => +(BIRIM[faz] / (ayar('k-' + il) * ayar('u-' + faz) ** 2)).toPrecision(3);
const VARSAYILAN_TIP = { cu: 'NYY', al: 'NAYY' };
const DOSEME_ADI = { toprak: 'Toprakta', hava: 'Havada', boru: 'Boruda' };
const FIRMA = 'Öznur Kablo';

const $ = id => document.getElementById(id);
const sayi = (x, b = 2) => x.toLocaleString('tr-TR', { minimumFractionDigits: b, maximumFractionDigits: b });
const katsayiYaz = x => x.toLocaleString('tr-TR', { maximumFractionDigits: 8, useGrouping: false });
const kesitYaz = s => sayi(+s, +s % 1 ? 1 : 0);
const secili = id => $(id).querySelector('[aria-pressed="true"]').dataset.v;
const ayar = id => +$(id).value;

function ayarlariYukle() {
  let kayitli = {};
  try { kayitli = JSON.parse(localStorage.getItem(ANAHTAR)) || {}; } catch (e) {}
  for (const [id, v] of Object.entries(VARSAYILAN)) $(id).value = kayitli[id] ?? v;
}
function ayarlariKaydet() {
  const o = {};
  for (const id of Object.keys(VARSAYILAN)) o[id] = +$(id).value;
  try { localStorage.setItem(ANAHTAR, JSON.stringify(o)); } catch (e) {}
}
function ayarlariIsaretle() {
  for (const [id, v] of Object.entries(VARSAYILAN)) $(id).classList.toggle('degisti', +$(id).value !== v);
  for (const k of ['normal', 'motor', 'trafo']) $('lb-' + k).textContent = '%' + sayi(ayar('e-' + k), 1).replace(/,0$/, '');
  $('lb-u3').textContent = ayar('u-3') + ' V';
  $('lb-u1').textContent = ayar('u-1') + ' V';
  const satir = (faz, il, ad) => `${ad}: ${BIRIM[faz]} / (${ayar('k-' + il)} × ${ayar('u-' + faz)}²) = ${katsayiYaz(katsayiHesapla(faz, il))}`;
  $('katsayiListe').innerHTML = [satir('3', 'cu', 'Trifaze bakır'), satir('3', 'al', 'Trifaze alüminyum'),
    satir('1', 'cu', 'Monofaze bakır'), satir('1', 'al', 'Monofaze alüminyum')].join('<br>');
}

function tipleriGuncelle() {
  const il = secili('iletken');
  const tipler = Object.keys(KABLOLAR).filter(k => KABLOLAR[k].iletken === il);
  $('tip').innerHTML = tipler.map(k => `<option value="${k}">${k}</option>`).join('');
  $('tip').value = VARSAYILAN_TIP[il];
  dosemeGuncelle();
}
function dosemeGuncelle() {
  const k = KABLOLAR[$('tip').value];
  $('doseme').innerHTML = k.sutunlar.map((s, i) => `<option value="${i}">${DOSEME_ADI[s]}</option>`).join('');
}

const sayiMi = v => /^[\d.,]+$/.test(v) ? +v.replace(',', '.') : null;
const satirEtiketi = r => r[0].replace(/^\*/, '').split(' ')[0];

// Hesapta denenecek kablolar, doğrudan firma tablosundan.
// Trifaze: 16 mm²'ye kadar 4 damarlı, üstünde piyasadaki gibi nötrü küçültülmüş 3 damarlı (3x25/16 …).
// Monofaze: 3 damarlı, yoksa 2 damarlı.
function adaylar(tip, faz) {
  const hepsi = KATALOG.filter(t => t.kablo === tip).flatMap(t => t.satirlar.map(r => {
    const m = satirEtiketi(r).match(/^(?:(\d+)x)?([\d.]+)(?:\/([\d.]+))?$/);
    return { etiket: satirEtiketi(r), ad: m[1] ? satirEtiketi(r) : '1x' + satirEtiketi(r), damar: m[1] || '1', S: +m[2], notr: m[3] || null, akim: r.slice(t.akimSutun).map(sayiMi) };
  })).filter(x => x.akim.some(v => v != null));
  const grup = (d, notrlu) => hepsi.filter(x => x.damar === d && !!x.notr === notrlu);
  const ilkDolu = (...g) => g.find(x => x.length) || [];
  let liste;
  if (hepsi.every(x => x.damar === '1')) liste = hepsi;
  else if (faz === '3') {
    const dort = ilkDolu(grup('4', false), grup('5', false), grup('3', false));
    const notrlu = grup('3', true);
    liste = dort.filter(x => x.S <= 16).concat(notrlu.length ? notrlu.filter(x => x.S > 16) : dort.filter(x => x.S > 16));
  } else liste = ilkDolu(grup('3', false), grup('2', false));
  return liste.sort((a, b) => a.S - b.S);
}

function firmaTablosu(tip, etiket) {
  // Kablonun katalogdaki bütün tabloları tek tabloda, katalog sırasıyla.
  const tablolar = KATALOG.filter(t => t.kablo === tip);
  const ilk = tablolar[0];
  const satirlar = tablolar.flatMap(t => t.satirlar);
  const dipnotlar = [...new Set(tablolar.map(t => t.dipnot).filter(Boolean))];

  $('firmaBaslik').textContent = `${ilk.firma} tablosu: ${tip}`;
  $('firmaBilgi').textContent = `${ilk.urun} · ${ilk.tip} · ${ilk.standart}`;
  const h = ilk.basliklar, a = ilk.akimSutun;
  $('firmaTablo').innerHTML = `<thead>
      <tr>${h.slice(0, a).map(x => `<th rowspan="2">${x}</th>`).join('')}<th colspan="${h.length - a}">${ilk.akimBasligi}</th></tr>
      <tr>${h.slice(a).map(x => `<th>${x}</th>`).join('')}</tr>
    </thead><tbody>` +
    satirlar.map(r => `<tr class="${etiket && satirEtiketi(r) === etiket ? 'secilen' : ''}">${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('') +
    '</tbody>';
  $('firmaNot').innerHTML = `${dipnotlar.join('<br>')}<br>Yeşil satır hesapta seçilen kablo. Kaynak: <a href="${encodeURI(ilk.url)}" target="_blank" rel="noopener">${ilk.firma} ürün sayfası</a> (Kasım 2026).`;
}

function hesapla() {
  ayarlariIsaretle();
  const faz = secili('faz');
  const il = secili('iletken');
  const kullanim = secili('kullanim');
  const e = ayar('e-' + kullanim);
  const U = ayar('u-' + faz);
  const k = ayar('k-' + il);
  const c = U > 0 && k > 0 ? katsayiHesapla(faz, il) : 0;
  const P = +$('guc').value;
  const L = +$('uzunluk').value;
  const cosfi = ayar('cosfi');
  const tip = $('tip').value;
  const kablo = KABLOLAR[tip];
  const sutun = +$('doseme').value;

  if (!(P > 0 && L > 0 && c > 0 && e > 0 && cosfi > 0)) {
    $('sonuc').innerHTML = '<span class="uyari">Güç ve mesafeyi girin. Ayarlardaki değerler sıfırdan büyük olmalı.</span>';
    firmaTablosu(tip, null);
    return;
  }

  const Sgerek = c * P * L / e;
  const I = faz === '3' ? P / (Math.sqrt(3) * U * cosfi) : P / (U * cosfi);
  const liste = adaylar(tip, faz).filter(x => x.akim[sutun] != null);
  const dusumIcin = liste.find(x => x.S >= Sgerek);
  const secilen = liste.find(x => x.S >= Sgerek && x.akim[sutun] >= I);
  const doseme = DOSEME_ADI[kablo.sutunlar[sutun]].toLowerCase();
  firmaTablosu(tip, secilen && secilen.etiket);

  if (!secilen) {
    $('sonuc').innerHTML = `<span class="uyari">${tip} tablosunda yeterli kesit yok. Gerekli kesit ${sayi(Sgerek)} mm², hat akımı ${sayi(I, 1)} A. Paralel kablo veya başka kablo tipi düşünün.</span>`;
    return;
  }

  const notrNotu = secilen.notr ? `<div class="not">16 mm² üstünde piyasada kullanılan nötrü küçültülmüş kablo seçildi (${secilen.ad}).</div>` : '';
  const akimNotu = secilen !== dusumIcin
    ? `<div class="not">${dusumIcin.ad} ${doseme} ${dusumIcin.akim[sutun]} A taşır, akım için yetmiyor. Bir üst kesite çıkıldı.</div>`
    : '';

  $('sonuc').innerHTML = `
    <div class="adim">
      <b>Gerekli kablo</b>
      <div class="buyuk">${tip} ${secilen.ad} mm²</div>
      ${notrNotu}
      <div class="not">Gerilim düşümü %${sayi(c * P * L / secilen.S)} · ${doseme} ${secilen.akim[sutun]} A taşır</div>
    </div>
    <div class="adim">
      <b>1. Formül</b>
      <div class="formul">katsayı = ${BIRIM[faz]} / (${k} × ${U}²) = ${katsayiYaz(c)}</div>
      <div class="formul">S = ${katsayiYaz(c)} × P × L / %e</div>
      <div class="formul">S = ${katsayiYaz(c)} × ${sayi(P, 0)} × ${sayi(L, 0)} / ${sayi(e, 1)} = <span class="deger">${sayi(Sgerek)} mm²</span></div>
    </div>
    <div class="adim">
      <b>2. Tablodan</b>
      <div>${sayi(Sgerek)} mm²'nin bir üstü: <span class="deger">${dusumIcin.ad}</span></div>
    </div>
    <div class="adim">
      <b>3. Akım kontrolü</b>
      ${akimNotu}
      <div class="formul">I = ${faz === '3' ? `P / (√3 × ${U} × ${sayi(cosfi)})` : `P / (${U} × ${sayi(cosfi)})`} = ${sayi(I, 1)} A</div>
      <div>Hat akımı ${sayi(I, 1)} A ≤ ${secilen.ad} taşıma ${secilen.akim[sutun]} A ✓</div>
    </div>`;
}

for (const grup of ['faz', 'iletken', 'kullanim']) {
  $(grup).addEventListener('click', ev => {
    const btn = ev.target.closest('button');
    if (!btn) return;
    $(grup).querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === btn));
    if (grup === 'iletken') tipleriGuncelle();
    hesapla();
  });
}
$('tip').addEventListener('change', () => { dosemeGuncelle(); hesapla(); });
$('doseme').addEventListener('change', hesapla);
$('guc').addEventListener('input', hesapla);
$('uzunluk').addEventListener('input', hesapla);
for (const id of Object.keys(VARSAYILAN)) $(id).addEventListener('input', () => { ayarlariKaydet(); hesapla(); });
$('sifirla').addEventListener('click', () => {
  for (const [id, v] of Object.entries(VARSAYILAN)) $(id).value = v;
  ayarlariKaydet(); hesapla();
});
ayarlariYukle();
tipleriGuncelle();
hesapla();
</script>
</body>
</html>
