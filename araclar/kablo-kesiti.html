<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kablo Kesiti Hesabı</title>
<link rel="stylesheet" href="../ortak/stil.css">
<style>
  .giris { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .giris label { min-width: 0; }
  .giris input { font-size: 1.4rem; padding: 12px; width: 100%; min-width: 0; }
  .secim { display: flex; gap: 8px; margin-bottom: 12px; }
  .secim button {
    flex: 1; font: inherit; padding: 10px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--cizgi); background: var(--zemin); color: var(--yazi);
  }
  .secim button[aria-pressed="true"] { background: var(--baslik); color: #fff; border-color: var(--baslik); }
  .buyuk { font-size: 2rem; font-weight: 700; color: var(--vurgu); margin: 4px 0; }
  .adim { padding: 10px 0; border-top: 1px solid var(--cizgi); }
  .adim:first-child { border-top: 0; padding-top: 0; }
  .adim b { display: block; font-size: .85rem; color: var(--soluk); font-weight: 600; }
  .formul { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9rem; overflow-wrap: anywhere; }
  .deger { font-weight: 700; }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--soluk); font-size: .9rem; }
  details form { margin-top: 12px; }
</style>
</head>
<body>
<header>
  <a href="../index.html">← Proje İşleri</a>
  <h1>Kablo kesiti</h1>
</header>
<main>
  <div class="kart">
    <div class="secim">
      <button type="button" id="b3" aria-pressed="true">Trifaze 400 V</button>
      <button type="button" id="b1" aria-pressed="false">Monofaze 230 V</button>
    </div>
    <div class="giris">
      <label>Güç (kW)
        <input id="guc" type="number" inputmode="decimal" value="30" min="0" step="any">
      </label>
      <label>Mesafe (m)
        <input id="uzunluk" type="number" inputmode="decimal" value="100" min="0" step="any">
      </label>
    </div>
  </div>

  <div class="kart" id="sonuc"></div>

  <div class="kart">
    <details>
      <summary>Ayarlar</summary>
      <form onsubmit="return false">
        <label>Kablo tipi
          <select id="tip">
            <option value="NYY">NYY</option>
            <option value="N2XY">N2XY</option>
            <option value="N2XH">N2XH</option>
            <option value="NYM">NYM</option>
            <option value="NYA">NYA</option>
          </select>
        </label>
        <label>Döşeme
          <select id="doseme"></select>
        </label>
        <label>İzin verilen düşüm (%)
          <input id="limit" type="number" value="3" min="0.1" step="0.1">
        </label>
        <label>cos φ
          <input id="cosfi" type="number" value="0.85" min="0.1" max="1" step="0.01">
        </label>
      </form>
    </details>
  </div>
</main>
<script src="../veri/kablolar.js"></script>
<script>
const K = 56;
const DOSEME_ADI = { toprak: 'Toprakta', hava: 'Havada', boru: 'Boruda' };
const $ = id => document.getElementById(id);
const sayi = (x, b = 2) => x.toLocaleString('tr-TR', { minimumFractionDigits: b, maximumFractionDigits: b });
const kesitYaz = s => sayi(+s, +s % 1 ? 1 : 0);
let faz = 3;

function dosemeGuncelle() {
  const k = KABLOLAR[$('tip').value];
  $('doseme').innerHTML = k.sutunlar.map((s, i) => `<option value="${i}">${DOSEME_ADI[s]}</option>`).join('');
}

function hesapla() {
  const U = faz === 3 ? 400 : 230;
  const P = +$('guc').value * 1000;
  const L = +$('uzunluk').value;
  const e = +$('limit').value;
  const cosfi = +$('cosfi').value;
  const tip = $('tip').value;
  const kablo = KABLOLAR[tip];
  const sutun = +$('doseme').value;
  const damar = kablo.tekDamar ? null : (faz === 3 ? ['4', '5', '3'] : ['3', '2']).find(n => kablo.damar[n]);
  const tablo = kablo.tekDamar || kablo.damar[damar];

  if (!(P > 0 && L > 0 && e > 0 && cosfi > 0)) {
    $('sonuc').innerHTML = '<span class="uyari">Güç ve mesafeyi girin.</span>';
    return;
  }

  const c = faz === 3 ? 100 : 200;
  const Sgerek = c * L * P / (K * e * U * U);
  const I = faz === 3 ? P / (Math.sqrt(3) * U * cosfi) : P / (U * cosfi);
  const kesitler = Object.keys(tablo).sort((a, b) => a - b).filter(s => tablo[s][sutun] != null);
  const dusumIcin = kesitler.find(s => +s >= Sgerek);
  const secilen = kesitler.find(s => +s >= Sgerek && tablo[s][sutun] >= I);
  const ad = s => kablo.tekDamar ? `${tip} 1x${kesitYaz(s)}` : `${tip} ${damar}x${kesitYaz(s)}`;
  const dusum = s => c * L * P / (K * +s * U * U);

  let akimNotu = '';
  if (secilen && dusumIcin && secilen !== dusumIcin) {
    akimNotu = `<div class="not">${kesitYaz(dusumIcin)} mm² düşümü karşılıyor ama ${tablo[dusumIcin][sutun]} A taşıyor, akım için yetmiyor. Bir üst kesite çıkıldı.</div>`;
  }

  $('sonuc').innerHTML = secilen ? `
    <div class="adim">
      <b>Gerekli kablo</b>
      <div class="buyuk">${ad(secilen)} mm²</div>
      <div class="not">Gerilim düşümü %${sayi(dusum(secilen))} · ${DOSEME_ADI[kablo.sutunlar[sutun]].toLowerCase()} ${tablo[secilen][sutun]} A taşır</div>
    </div>
    <div class="adim">
      <b>1. Formül</b>
      <div class="formul">S = ${c} × L × P / (k × %e × U²)</div>
      <div class="formul">S = ${c} × ${sayi(L, 0)} × ${sayi(P, 0)} / (56 × ${sayi(e, 1)} × ${U}²) = <span class="deger">${sayi(Sgerek)} mm²</span></div>
    </div>
    <div class="adim">
      <b>2. Tablodan</b>
      <div>${sayi(Sgerek)} mm²'nin bir üstü: <span class="deger">${kesitYaz(dusumIcin)} mm²</span></div>
    </div>
    <div class="adim">
      <b>3. Akım kontrolü</b>
      ${akimNotu}
      <div>Hat akımı ${sayi(I, 1)} A ≤ ${kesitYaz(secilen)} mm² taşıma ${tablo[secilen][sutun]} A ✓</div>
    </div>`
  : `<span class="uyari">Bu güç ve mesafe için ${tip} tablosunda yeterli kesit yok (gerekli ${sayi(Sgerek)} mm², akım ${sayi(I, 1)} A). Paralel kablo düşünün.</span>`;
}

function fazSec(f) {
  faz = f;
  $('b3').setAttribute('aria-pressed', f === 3);
  $('b1').setAttribute('aria-pressed', f === 1);
  hesapla();
}
$('b3').onclick = () => fazSec(3);
$('b1').onclick = () => fazSec(1);
$('tip').addEventListener('change', () => { dosemeGuncelle(); hesapla(); });
document.querySelectorAll('input, #doseme').forEach(el => el.addEventListener('input', hesapla));
dosemeGuncelle();
hesapla();
</script>
</body>
</html>
